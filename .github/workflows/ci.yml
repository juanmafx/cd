name: CI

on:
  push:
    branches: [main, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.3', '24.22.0']
    steps:
      - name: Check out repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js (actions/setup-node v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Audit production dependencies
        run: npm run audit:prod
